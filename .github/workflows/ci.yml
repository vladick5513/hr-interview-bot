name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 2s
          --health-retries 30
    env:
      BOT_TOKEN: "123456:ci"
      HR_IDS: "[1]"
      OPENAI_API_KEY: ci
      OPENAI_MODEL: ci
      HH_USER_AGENT: hr-interview-bot-ci/0.1
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_USER: ci
      DB_PASS: ci
      DB_NAME: ci
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: ruff format --check app tests
      - run: pytest
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head